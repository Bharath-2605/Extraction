name: PDF URL Capture
description: Extract and verify URLs from PDF files for Anaconda Workbench
channels:
  - defaults
  - conda-forge
packages:
  - python=3.11
  - pandas
  - openpyxl
  - requests
  - notebook
  - pip:
      - fastapi>=0.115.0
      - uvicorn>=0.32.0
      - python-multipart>=0.0.12
      - xlrd>=2.0.1
      - pymupdf>=1.24.0
      - numpy>=1.26.0
      - pillow>=10.4.0
      - opencv-python-headless>=4.10.0
      - onnxruntime>=1.19.0
      - rapidocr>=1.4.0
      - ocrmac>=1.0.0
env_specs:
  default:
    packages: []
commands:
  default:
    unix: python ${PROJECT_DIR}/launch.py
    windows: python launch.py
    supports_http_options: true
